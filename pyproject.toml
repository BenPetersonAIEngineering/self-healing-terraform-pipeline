[project]
name = "healer"
version = "0.1.0"
description = "Self-healing Terraform CI/CD pipeline eval harness"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=1.0",
]

[project.scripts]
healer = "healer.cli:main_entry"
healer-source = "healer.sourcing.github_source:main_entry"
healer-live-watch = "healer.live.live_watcher:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["healer", "healer.tools", "healer.agents", "healer.sourcing", "healer.live"]
