[project]
name = "healer"
version = "0.1.0"
description = "Self-healing Terraform CI/CD pipeline eval harness"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=1.0",
]

[project.scripts]
healer = "healer.cli:main_entry"
healer-source = "healer.sourcing.github_source:main_entry"
healer-live-watch = "healer.live.live_watcher:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["healer", "healer.tools", "healer.agents", "healer.sourcing", "healer.live"]

[tool.pytest.ini_options]
# Without this, a live-mode run checking out this repo's own PR branches
# into runs/live/<pr>/workdir/ leaves a full clone of this project —
# including tests/ — sitting under runs/, and pytest's default collection
# picks up those duplicate test modules too (confirmed live: "import file
# mismatch" across every test file once that happened).
testpaths = ["tests"]
