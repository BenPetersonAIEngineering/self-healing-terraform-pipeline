[project]
name = "healer"
version = "0.1.0"
description = "Self-healing CI/CD pipeline that automatically fixes Terraform bugs on real GitHub PRs"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
]

[project.scripts]
healer-live-watch = "healer.live.live_watcher:main_entry"
healer-run-pr = "healer.live.run_pr:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["healer", "healer.tools", "healer.agents", "healer.live"]

[tool.pytest.ini_options]
# Without this, a live-mode run checking out this repo's own PR branches
# into runs/live/<pr>/workdir/ leaves a full clone of this project —
# including tests/ — sitting under runs/, and pytest's default collection
# picks up those duplicate test modules too (confirmed live: "import file
# mismatch" across every test file once that happened).
testpaths = ["tests"]
